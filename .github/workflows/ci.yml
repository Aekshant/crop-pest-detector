name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (host build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # golden images
      - name: Configure
        run: cmake -S core -B build/core -DFARM_CORE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/core -j
      - name: Test
        run: ctest --test-dir build/core --output-on-failure

  evals:
    name: evals (scorer tests + case checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scorer tests
        run: python -m unittest discover -s evals/tests -v
      - name: Laya case checks
        run: python evals/laya/check_cases.py

  android:
    name: android (Kotlin app + NDK core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # .tflite models packaged as assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
